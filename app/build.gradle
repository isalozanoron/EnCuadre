plugins {
    id 'com.android.application'
}

android {
    namespace 'com.encuadre.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.encuadre.mobile"
        // La rúbrica de la entrega exige instalar en API 27 (Android 8.1) o superior.
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
